name: ReturnWise CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    # Every PR, including stacked reviews, must run the full quality gate.

# Minimal Permissions Policy (Principle of Least Privilege)
permissions:
  contents: read

# Concurrency Control: cancel redundant in-progress workflows
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (Typecheck, Lint, Build, Tests & Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: 1. Strict TypeScript Typecheck
        run: npm run typecheck

      - name: 2. ESLint Code Quality & Standards
        run: npm run lint

      - name: 3. Production Bundle Build (esbuild)
        run: npm run build

      - name: 3b. S3 Worker ESM bundle validation (offline)
        run: npm run check:worker

      - name: 4. Full Automated Test Suite (all tests)
        run: npm test

      - name: 5. Security Vulnerability Audit (High/Critical Zero-Tolerance)
        run: npm audit --audit-level=high

      - name: 6. Archive Production Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: returnwise-dist
          path: dist/
          retention-days: 7

  browser-e2e:
    name: Real Chromium Desktop + Mobile & axe WCAG
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked app dependencies
        run: npm ci

      - name: Build real production artifacts
        run: npm run build

      - name: Install pinned browser QA tools without altering app lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1 @axe-core/playwright@4.14.0

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser interaction, CSV, mobile and axe tests
        run: npm run test:browser

      - name: Archive failed browser traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: returnwise-s5-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
