<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>페이지를 찾을 수 없습니다 (404) | ReturnWise</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #F8FAFC;
        color: #0F172A;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
      }
      .container {
        max-width: 520px;
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 12px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      h1 {
        font-size: 24px;
        color: #1E293B;
        margin-top: 0;
        margin-bottom: 12px;
      }
      p {
        font-size: 15px;
        color: #475569;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-block;
        background-color: #2563EB;
        color: #FFFFFF;
        font-weight: 600;
        font-size: 15px;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }
      .btn:hover {
        background-color: #1D4ED8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404 - 페이지를 찾을 수 없습니다</h1>
      <p>
        요청하신 주소의 페이지가 존재하지 않거나 이동되었습니다.<br />
        ReturnWise 반품 비용 비교 계산기 메인 페이지로 이동해 주세요.
      </p>
      <a href="/" class="btn">계산기 메인으로 이동</a>
    </div>
  </body>
</html>
